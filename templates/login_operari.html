{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-10 bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
    <div class="text-center mb-6">
        <span class="text-4xl inline-block mb-2">👷</span>
        <h2 class="text-xl font-bold text-slate-800">Accés d'Operari</h2>
        <p class="text-xs text-slate-500 mt-1">Selecciona el teu usuari e introdueix la contrasenya</p>
    </div>

    {% if msg_ok %}
    <div class="bg-emerald-100 border border-emerald-400 text-emerald-800 text-xs px-3 py-2 rounded-lg mb-4 text-center font-bold">
        ✅ {{ msg_ok }}
    </div>
    {% endif %}

    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 text-xs px-3 py-2 rounded-lg mb-4 text-center font-bold">
        ⚠️ Contrasenya o usuari incorrecte. Torna-ho a provar.
    </div>
    {% endif %}

    <form action="/login_operari" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Operari:</label>
            <select name="operari" class="w-full p-2.5 rounded-lg text-xs font-bold border border-slate-300 bg-slate-50 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500">
                {% for op in operaris %}
                    <option value="{{ op }}" {% if operari_sel == op %}selected{% endif %}>👷 {{ op }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Contrasenya:</label>
            <input type="password" name="password" required placeholder="La teva contrasenya..." class="w-full p-2.5 rounded-lg text-xs border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center space-x-2 py-1">
            <input type="checkbox" id="remember" name="remember" value="1" checked class="w-4 h-4 text-blue-600 rounded border-slate-300">
            <label for="remember" class="text-xs font-semibold text-slate-700 cursor-pointer select-none">
                🔒 Recorda'm en aquest dispositiu
            </label>
        </div>

        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-xl text-xs shadow-md transition">
            🔑 Entrar al Panell
        </button>
    </form>

    <div class="mt-6 border-t pt-3 text-center">
        <button type="button" onclick="document.getElementById('form-oblidat').classList.toggle('hidden')" class="text-xs text-blue-700 hover:underline font-bold">
            ❓ Has oblidat la teva contrasenya?
        </button>

        <form id="form-oblidat" action="/sollicitar_recuperacio" method="POST" class="hidden mt-3 space-y-2 bg-slate-50 p-3 rounded-xl border">
            <label class="block text-[11px] font-bold text-slate-700">Introdueix el teu correu electrònic:</label>
            <input type="email" name="email" required placeholder="nom@exemple.com" class="w-full p-2 border rounded text-xs bg-white font-semibold">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs shadow">
                📧 Enviar enllaç de recuperació
            </button>
        </form>
    </div>
</div>
{% endblock %}

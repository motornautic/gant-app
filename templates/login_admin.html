{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-5">
        <div class="text-center space-y-2">
            <span class="text-4xl">🔐</span>
            <h2 class="text-xl font-bold text-slate-800">Accés Administració</h2>
            <p class="text-xs text-slate-500 font-medium">MotorNautic Gestió - Àrea Privada</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg text-xs font-bold text-center">
            ⚠️ Usuari o contrasenya incorrectes.
        </div>
        {% endif %}

        <form action="/login_admin" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">👤 Usuari Admin:</label>
                <input type="text" name="usuari" required placeholder="Usuari" class="w-full p-2.5 text-xs border rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 font-bold text-slate-800">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">🔑 Contrasenya:</label>
                <input type="password" name="password" required placeholder="Contrasenya" class="w-full p-2.5 text-xs border rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 font-bold text-slate-800">
            </div>

            <button type="submit" class="w-full bg-blue-900 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-xs shadow transition cursor-pointer">
                🚀 Entrar al Panell de Gestió
            </button>
        </form>
    </div>
</div>
{% endblock %}

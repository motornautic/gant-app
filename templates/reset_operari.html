{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-10 bg-white p-6 rounded-2xl shadow-xl border border-slate-200 space-y-4">
  <h2 class="text-xl font-bold text-blue-900">🔐 Nova contrasenya d'operari</h2>
  {% if error %}<div class="bg-red-100 p-3 rounded text-red-800 text-sm">{{ error }}</div>{% endif %}
  {% if token %}
  <form method="POST" action="{{ url_for('operari.validar_codi_recuperacio') }}" class="space-y-3">
    <input type="hidden" name="token" value="{{ token }}">
    <label class="block text-sm font-semibold">Nova contrasenya (mínim 8 caràcters)
      <input type="password" name="nova_password" minlength="8" required autocomplete="new-password" class="mt-1 w-full border rounded-lg p-2">
    </label>
    <label class="block text-sm font-semibold">Repetir contrasenya
      <input type="password" name="confirmar_password" minlength="8" required autocomplete="new-password" class="mt-1 w-full border rounded-lg p-2">
    </label>
    <button class="w-full rounded-lg bg-blue-800 text-white p-3 font-bold" type="submit">Guardar nova contrasenya</button>
  </form>
  {% endif %}
  <a href="{{ url_for('operari.vista_operari', triar_operari=1) }}" class="block text-sm text-blue-700 underline">Tornar a l'accés d'operari</a>
</div>
{% endblock %}
